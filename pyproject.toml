[project]
name = "notifyrouter"
version = "0.4.2"
description = "Rules-driven universal webhook notification gateway"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
  "Flask>=3.1,<4",
  "cryptography>=45,<47",
  "requests>=2.32,<3",
  "waitress>=3.0,<4",
]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
notifyrouter = "notifyrouter.app:main"

[build-system]
requires = ["setuptools>=78"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["notifyrouter*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
