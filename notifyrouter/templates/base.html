<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{% block title %}NotifyRouter{% endblock %}</title><link rel="icon" href="{{ url_for('static',filename='favicon.svg') }}" type="image/svg+xml"><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/semantic-ui-css@2.5.0/semantic.min.css"><link rel="stylesheet" href="{{ url_for('static',filename='style.css') }}"></head><body class="notifyrouter"><header class="ui borderless menu"><a class="header item" href="{{ url_for('admin') }}"><img src="{{ url_for('static',filename='logo.png') }}" alt="NotifyRouter"></a></header><main class="ui container">{% block content %}{% endblock %}</main><script>document.querySelectorAll('form').forEach(e=>e.classList.add('ui','form'));document.querySelectorAll('.card').forEach(e=>e.classList.add('ui','segment'));document.querySelectorAll('table').forEach(e=>e.classList.add('ui','celled','compact','table'));document.querySelectorAll('button').forEach(e=>e.classList.add('ui','button'));</script></body></html>
